name: Flutter Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.0"
  JAVA_VERSION: "17"
  AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
  AVALAI_BASE_URL: ${{ secrets.AVALAI_BASE_URL || 'https://api.avalai.ir' }}
  AI_MODEL: ${{ secrets.AI_MODEL || 'gemini-3.1-flash-lite' }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://evyjrbwibwrdkjakooor.supabase.co' }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_SYNC_EMAIL: ${{ secrets.SUPABASE_SYNC_EMAIL || 'owner@studyhub.app' }}
  SUPABASE_SYNC_PASSWORD: ${{ secrets.SUPABASE_SYNC_PASSWORD }}

jobs:
  analyze-test:
    name: Analyze and Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-24.04
    needs: analyze-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Prepare Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/studyhub-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/studyhub-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Android APK and app bundle
        shell: bash
        run: |
          flutter build apk --release \
            --dart-define=AVALAI_API_KEY="$AVALAI_API_KEY" \
            --dart-define=AVALAI_BASE_URL="$AVALAI_BASE_URL" \
            --dart-define=AI_MODEL="$AI_MODEL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SUPABASE_SYNC_EMAIL="$SUPABASE_SYNC_EMAIL" \
            --dart-define=SUPABASE_SYNC_PASSWORD="$SUPABASE_SYNC_PASSWORD"
          flutter build appbundle --release \
            --dart-define=AVALAI_API_KEY="$AVALAI_API_KEY" \
            --dart-define=AVALAI_BASE_URL="$AVALAI_BASE_URL" \
            --dart-define=AI_MODEL="$AI_MODEL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SUPABASE_SYNC_EMAIL="$SUPABASE_SYNC_EMAIL" \
            --dart-define=SUPABASE_SYNC_PASSWORD="$SUPABASE_SYNC_PASSWORD"

      - name: Collect Android artifacts
        shell: bash
        run: |
          mkdir -p build/release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk build/release-artifacts/StudyHUB-Android.apk
          cp build/app/outputs/bundle/release/app-release.aab build/release-artifacts/StudyHUB-Android.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studyhub-android-release
          path: build/release-artifacts/*
          if-no-files-found: error

  build-web:
    name: Build Web
    runs-on: ubuntu-24.04
    needs: analyze-test
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Prepare Drift web runtime
        run: dart run tool/prepare_web.dart

      - name: Build Flutter web
        shell: bash
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=AVALAI_API_KEY="$AVALAI_API_KEY" \
            --dart-define=AVALAI_BASE_URL="$AVALAI_BASE_URL" \
            --dart-define=AI_MODEL="$AI_MODEL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SUPABASE_SYNC_EMAIL="$SUPABASE_SYNC_EMAIL" \
            --dart-define=SUPABASE_SYNC_PASSWORD="$SUPABASE_SYNC_PASSWORD"

      - name: Package web release artifact
        shell: bash
        run: |
          mkdir -p build/release-artifacts
          tar -czf build/release-artifacts/StudyHUB-Web.tar.gz -C build/web .

      - name: Upload web release artifact
        uses: actions/upload-artifact@v4
        with:
          name: studyhub-web-release
          path: build/release-artifacts/StudyHUB-Web.tar.gz
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-24.04
    needs: build-web
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    needs: analyze-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Flutter Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\release-artifacts
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\release-artifacts\StudyHUB-Windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: studyhub-windows-release
          path: build/release-artifacts/StudyHUB-Windows.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - build-android
      - build-web
      - build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.tar.gz' -o -name '*.zip' \) | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi
          dart tool/github_release.dart "${assets[@]}"
